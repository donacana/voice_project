version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: voice-lecture-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voice_lecture_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice-lecture-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - voice_lecture_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voice-lecture-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - voice_lecture_network

volumes:
  postgres_data:

networks:
  voice_lecture_network:
    driver: bridge
